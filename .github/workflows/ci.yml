# Checks for dev and feature branches, and for pull requests into dev or main.
# Nothing here publishes; the built zip is kept as a workflow artifact for trying a branch.
name: ci

on:
  push:
    branches: [dev, "feat/**", "bugfix/**", "refactor/**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: api-http-generator-plugin
          path: build/distributions/*.zip
          retention-days: 14
